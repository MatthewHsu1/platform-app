name: Release

# Builds the app package for a version tag and attaches it to a GitHub release.
# It never talks to a Twenty server: deploy repos download the asset and install it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v2.5.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The tag must be v<version> of package.json, so the asset name is predictable.
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Yarn comes from the packageManager field in package.json.
      # Corepack must be on first so setup-node's yarn cache uses Yarn 4.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Lint is not run here: its rules come from Twenty's fork checkout (../twenty),
      # which this runner does not have. Run it locally before you tag.
      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      # The build is one Node process. It bundles each of the ~940 config files
      # (each bundle holds a copy of twenty-sdk, about 2 MB) and keeps every compiled
      # bundle in memory until it ends, so the heap grows with the file count and
      # peaks at about 8 GB. 8192 failed on the runner. The runner has 16 GB.
      - name: Build the app package
        env:
          NODE_OPTIONS: --max-old-space-size=10240
        run: yarn twenty dev:build --tarball

      - name: Check the package exists
        run: test -f ".twenty/output/platform-${VERSION}.tgz"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset=".twenty/output/platform-${VERSION}.tgz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --title "$TAG" --generate-notes --verify-tag
          fi
