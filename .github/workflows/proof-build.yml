name: Proof build (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Build the app package
        env:
          TWENTY_FAST_BUILD: '1'
        run: /usr/bin/time -v yarn twenty dev:build --tarball
      - run: test -f ".twenty/output/platform-$(node -p "require('./package.json').version").tgz"
